server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind a TLS-terminating ingress / reverse proxy: honour X-Forwarded-* headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  error:
    # ApiErrors returns explicit messages for client errors; never leak internals on 5xx.
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: openjcontroltower
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/controltower;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # Databases created by the pre-Flyway schema.sql are adopted as version 1.
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/openjcontroltower}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8081/realms/openjcontroltower/protocol/openid-connect/certs}
      client:
        registration:
          openjcockpit:
            provider: openjcockpit
            client-id: ${COCKPIT_CLIENT_ID:openjcontroltower-service}
            client-secret: ${COCKPIT_CLIENT_SECRET:local-placeholder}
            authorization-grant-type: client_credentials
        provider:
          openjcockpit:
            token-uri: ${COCKPIT_TOKEN_URI:http://localhost:8081/realms/openjcontroltower/protocol/openid-connect/token}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:unused-in-demo-mode}
      chat:
        enabled: ${AI_ENABLED:false}
        options:
          model: ${AI_MODEL:gpt-4o-mini}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
controltower:
  # Defaults for the settings page: values saved there take precedence.
  keycloak:
    # Public client the web application signs in with; the URL and realm come from KEYCLOAK_ISSUER_URI.
    client-id: ${KEYCLOAK_CLIENT_ID:controltower-web}
    # Recovery: true ignores the Keycloak settings saved on the settings page (for example after a wrong client ID).
    ignore-saved: ${KEYCLOAK_IGNORE_SAVED_SETTINGS:false}
  policy:
    # Open Policy Agent decides on repository changes, spec approval and dispatch when enabled.
    enabled: ${OPA_ENABLED:false}
    url: ${OPA_URL:http://localhost:8181}
    decision-path: ${OPA_DECISION_PATH:openjcontroltower/decision}
    # false (fail closed): deny governed actions while the agent cannot be reached.
    fail-open: ${OPA_FAIL_OPEN:false}
  git:
    # Where each spec's isolated Git job runs: docker (through a Docker socket proxy) or kubernetes (a Job per spec).
    runner: ${GIT_RUNNER:docker}
    image: ${GIT_JOB_IMAGE:alpine/git:2.49.1}
    # Upper bound for clone, commits and push; spec approval waits for it.
    timeout: ${GIT_JOB_TIMEOUT:90s}
    branch-prefix: ${GIT_BRANCH_PREFIX:spec}
    author-name: ${GIT_AUTHOR_NAME:OpenJControlTower}
    author-email: ${GIT_AUTHOR_EMAIL:openjcontroltower@localhost}
    # Plain-HTTP Git URLs are for the local development Git server only.
    allow-http: ${GIT_ALLOW_HTTP:false}
    credentials:
      # No defaults: Git secrets are encrypted with this key (AES-256-GCM) and unreadable without it.
      secret: ${GIT_CREDENTIALS_SECRET}
      salt: ${GIT_CREDENTIALS_SALT}
    docker:
      host: ${DOCKER_PROXY_URL:http://docker-proxy:2375}
      # Network the job containers join; it must reach the Git host (and the dev Git server, if used).
      network: ${GIT_JOB_DOCKER_NETWORK:}
    kubernetes:
      api-url: ${KUBERNETES_API_URL:https://kubernetes.default.svc}
      service-account-dir: ${KUBERNETES_SERVICE_ACCOUNT_DIR:/var/run/secrets/kubernetes.io/serviceaccount}
      # Empty: the backend's own namespace.
      namespace: ${GIT_JOB_NAMESPACE:}
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${HTTP_READ_TIMEOUT:30s}
  ai:
    enabled: ${AI_ENABLED:false}
  cockpit:
    enabled: ${COCKPIT_ENABLED:false}
    base-url: ${COCKPIT_BASE_URL:http://localhost:8082}
  decisions:
    provider: ${DECISION_PROVIDER:deterministic}
    endpoint: ${DECISION_ENDPOINT:https://api.laya.studio/v1/systemone}
    api-key: ${DECISION_API_KEY:}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: openjcontroltower-backend
spec:
  template:
    spec:
      initContainers:
        - name: workspace-seed
          # The backend image ships git, so no extra image has to be trusted or mirrored.
          image: openjcontroltower-backend
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              while read -r name url; do
                case "$name" in ''|'#'*) continue ;; esac
                case "$name" in */*|.*) echo "invalid directory name: $name" >&2; exit 1 ;; esac
                if [ -d "/workspace/repos/$name/.git" ]; then
                  echo "keeping existing repository $name"
                else
                  git clone --quiet "$url" "/workspace/repos/$name"
                  echo "cloned $name"
                fi
              done < /seed/repositories.txt
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace/repos
            - name: tmp
              mountPath: /tmp
            - name: workspace-seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: workspace-seed
          secret:
            secretName: openjcontroltower-workspace-seed

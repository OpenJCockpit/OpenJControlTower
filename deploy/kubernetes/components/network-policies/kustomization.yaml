# Restricts in-namespace traffic: the backend accepts traffic on its port and only the backend
# may reach PostgreSQL. Requires a CNI that enforces NetworkPolicy (Calico, Cilium, ...).
# Prometheus scraping from another namespace needs an extra rule (see docs/KUBERNETES.md).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - network-policies.yaml

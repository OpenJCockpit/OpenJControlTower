apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openjcontroltower
              app.kubernetes.io/component: frontend
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openjcontroltower
              app.kubernetes.io/component: backend
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
---
# Git job pods accept no connections; they only clone from and push to the Git host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-git-jobs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: git-job
  policyTypes: [Ingress]
---
# Only the backend asks Open Policy Agent for decisions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-opa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: opa
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openjcontroltower
              app.kubernetes.io/component: backend
      ports:
        - port: 8181

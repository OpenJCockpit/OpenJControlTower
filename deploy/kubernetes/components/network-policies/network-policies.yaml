apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openjcontroltower
              app.kubernetes.io/component: frontend
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openjcontroltower
              app.kubernetes.io/component: backend
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjcontroltower-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080

# Kubernetes variant of frontend/nginx.conf: proxies to the backend Service, TLS ends at the Ingress.
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
 location /api/ { proxy_pass http://openjcontroltower-backend:8080/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
 location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
 location = /config.js { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; }
 location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; }
 location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; }
 location / { try_files $uri $uri/ /index.html; }
}

# Single entry point: the frontend serves the SPA and proxies /api to the backend Service.
# Overlays set ingressClassName, host and TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openjcontroltower
  labels:
    app.kubernetes.io/name: openjcontroltower
spec:
  rules:
    - host: controltower.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openjcontroltower-frontend
                port:
                  name: http

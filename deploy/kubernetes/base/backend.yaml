apiVersion: v1
kind: ServiceAccount
metadata:
  name: openjcontroltower-backend
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
# Git working copies that specs are written into. ReadWriteOnce: the backend runs as a single replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openjcontroltower-workspace
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openjcontroltower-backend
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openjcontroltower-backend
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
spec:
  # Exactly one replica: spec publication and dispatch are serialized in-process and the
  # workspace volume is ReadWriteOnce. Recreate avoids two pods mounting it during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openjcontroltower
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: openjcontroltower-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: openjcontroltower-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: openjcontroltower-backend-config
            - secretRef:
                name: openjcontroltower-backend-secrets
          env:
            - name: HOME
              value: /tmp
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give endpoints time to drop this pod before graceful shutdown starts.
                command: ["sleep", "5"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace/repos
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: openjcontroltower-workspace
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

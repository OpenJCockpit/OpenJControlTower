apiVersion: v1
kind: ServiceAccount
metadata:
  name: openjcontroltower-backend
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
# The backend publishes each approved spec from a disposable Job in its own namespace. The Job's inputs,
# including the Git credentials, go into a Secret owned by the Job, so Kubernetes deletes both together.
# The backend can create Secrets but never read them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openjcontroltower-git-jobs
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openjcontroltower-git-jobs
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openjcontroltower-git-jobs
subjects:
  - kind: ServiceAccount
    name: openjcontroltower-backend
---
apiVersion: v1
kind: Service
metadata:
  name: openjcontroltower-backend
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openjcontroltower-backend
  labels:
    app.kubernetes.io/name: openjcontroltower
    app.kubernetes.io/component: backend
spec:
  # Exactly one replica: dispatch is serialized in-process. Recreate keeps two pods from
  # dispatching at the same time during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: openjcontroltower
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openjcontroltower
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: openjcontroltower-backend
      # Needed to create the Git Jobs (see the Role above).
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: openjcontroltower-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: openjcontroltower-backend-config
            - secretRef:
                name: openjcontroltower-backend-secrets
          env:
            - name: HOME
              value: /tmp
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give endpoints time to drop this pod before graceful shutdown starts.
                command: ["sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

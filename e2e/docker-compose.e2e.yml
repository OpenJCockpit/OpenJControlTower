# Isolated, disposable stack for browser end-to-end tests. Run it with scripts/run-e2e.sh.
# Test-only realm and credentials: never reuse them outside this stack.
name: ojct-e2e
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: controltower
      POSTGRES_USER: controltower
      POSTGRES_PASSWORD: e2e-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controltower -d controltower"]
      interval: 2s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: e2e-only
    volumes:
      - ./keycloak/e2e-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # The image has no curl/wget: talk HTTP to the management port over bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 60
  # Remote the tests register; spec branches are pushed here by disposable job containers.
  git-server:
    build: ../infrastructure/git-server
    environment:
      GIT_SERVER_USER: e2e-git
      GIT_SERVER_PASSWORD: e2e-only-git
      GIT_SERVER_REPOSITORIES: e2e-repo
  # Standard policies, with test values: repositories may only use the test Git server.
  opa:
    build: ../infrastructure/opa
    volumes:
      - ./opa-config.json:/policies/openjcontroltower/config/data.json:ro
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  backend:
    build: ..
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/controltower
      DB_USER: controltower
      DB_PASSWORD: e2e-only
      # The browser reaches Keycloak as http://keycloak:8080, so that is the token issuer.
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/openjcontroltower
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/openjcontroltower/protocol/openid-connect/certs
      GIT_RUNNER: docker
      DOCKER_PROXY_URL: http://docker-proxy:2375
      GIT_JOB_DOCKER_NETWORK: ojct-e2e
      GIT_ALLOW_HTTP: "true"
      GIT_CREDENTIALS_SECRET: e2e-only-credentials-key-of-32-chars
      GIT_CREDENTIALS_SALT: 6e2e6e2e6e2e6e2e
      AI_ENABLED: "false"
      COCKPIT_ENABLED: "false"
      OPA_ENABLED: "true"
      OPA_URL: http://opa:8181
    depends_on:
      docker-proxy:
        condition: service_started
      git-server:
        condition: service_started
      opa:
        condition: service_started
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 3s
      retries: 60
  frontend:
    build: ../frontend
    volumes:
      - ./config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      retries: 20
  e2e:
    build: .
    profiles: [test]
    environment:
      BASE_URL: http://frontend:8080
      CI: ${CI:-}
    volumes:
      - ./playwright-report:/e2e/playwright-report
      - ./test-results:/e2e/test-results
networks:
  # Fixed name: Git job containers join it by name (GIT_JOB_DOCKER_NETWORK).
  default:
    name: ojct-e2e
